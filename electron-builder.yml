appId: com.studystream.desktop
productName: StudyStream
copyright: Copyright © 2026 StudyStream

directories:
  output: release

files:
  - dist
  - dist-electron
  - node_modules/sql.js
  - package.json
  - "!**/*.ts"
  - "!src/**"

extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm

extraMetadata:
  main: dist-electron/main.js

win:
  sign: null
  signAndEditExecutable: false
  icon: assets/icon.ico
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyStream
  artifactName: StudyStream-Setup-${version}.exe
